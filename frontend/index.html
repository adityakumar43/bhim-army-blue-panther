<!doctype html>
<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // A phone with "Desktop site" turned on: show the full desktop design (as on a 1280 px laptop screen, zoomed out to fit).
    // Found by: a touch screen the size of a phone, but a browser that says it is a computer.
    (function () {
      var small = Math.min(screen.width, screen.height) < 600
      var saysComputer = !/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
      if (navigator.maxTouchPoints > 0 && small && saysComputer) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=1280')
      }
    })()
  </script>
  <meta name="theme-color" content="#0B3C9D" />
  <title>Bhim Army Blue Panther</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- The font loads without holding up the page; until it arrives, text shows in the phone's own font -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap" rel="stylesheet" />
  </noscript>
  <!-- Connect to the backend and the photo server early, so the slides and news start loading sooner -->
  <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />
  <!-- The big photo on the home page starts downloading straight away -->
  <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />
  <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Blue Panther" />
  <meta name="description" content="Bhim Army Blue Panther — शिक्षित बनो, संगठित रहो, संघर्ष करो" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Bhim Army Blue Panther" />
  <meta property="og:description" content="शिक्षित बनो, संगठित रहो, संघर्ष करो" />
  <meta property="og:image" content="%VITE_SITE_URL%/og-default.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
</head>

<body>
  <script>
    // On the home page, start loading the slides list before the app's code has even arrived (saves about a second on phones)
    if (location.pathname === '/') window.__slides = fetch('%VITE_API_URL%/slides').then((r) => (r.ok ? r.json() : null)).catch(() => null)
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
